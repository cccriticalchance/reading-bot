<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Bot (Tap)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #111; color: #eee; }
  #cam { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #top { position: sticky; top: 0; z-index: 5; background: #111; padding-bottom: 4px; }
  #preview { width: 100%; max-height: 34vh; object-fit: contain; background: #000; border-radius: 8px; }
  input[type=range] { padding: 0; }
  .zoombox { background: #1b1b1b; border-radius: 8px; padding: 8px; margin: 6px 0; }
  .zoombox label { display: block; margin-top: 6px; }
  button { font-size: 16px; padding: 12px; margin: 4px 0; width: 100%; border: 0; border-radius: 8px; }
  #status { font-size: 22px; font-weight: bold; margin: 8px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  label { font-size: 13px; }
  input { width: 100%; font-size: 16px; padding: 6px; box-sizing: border-box; }
  pre { font-size: 11px; white-space: pre-wrap; background: #222; padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
<h2>Reading Bot (Tap)</h2>
<video id="cam" autoplay playsinline muted></video>
<div id="top">
  <canvas id="preview" width="640" height="360"></canvas>
  <div id="status">Ready</div>
  <div id="timer" style="font-size: 15px; color: #ccc;">Reading timer: not running</div>
</div>

<button id="btnCam">Camera on (set the zoom first)</button>

<h3>Zoom</h3>
<div class="zoombox">
  <div id="hwZoomBox" style="display:none">
    <label>Camera zoom: <span id="hwZoomVal">1.0x</span> (best quality)</label>
    <input id="hwZoom" type="range" min="1" max="4" step="0.1" value="1">
  </div>
  <label>Crop zoom: <span id="dzVal">1.0x</span> (digital, crops what is read)</label>
  <input id="dz" type="range" min="1" max="4" step="0.1" value="1">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); margin-top: 4px;">
    <button data-dz="1">1x</button>
    <button data-dz="1.5">1.5x</button>
    <button data-dz="2">2x</button>
    <button data-dz="3">3x</button>
  </div>
  <label>Crop left / right</label>
  <input id="panX" type="range" min="-100" max="100" step="1" value="0">
  <label>Crop up / down</label>
  <input id="panY" type="range" min="-100" max="100" step="1" value="0">
  <button id="btnZoomReset">Reset zoom</button>
  <div style="font-size: 12px; color: #aaa;">The preview at the top shows exactly the area that is read. Left/right and up/down only work when crop zoom is above 1x.</div>
</div>

<button id="btnBle">1. Connect Arduino (Bluetooth)</button>
<button id="btnTest">Test tap</button>
<div class="grid">
  <button id="btnMinus">Angle -</button>
  <button id="btnPlus">Angle +</button>
</div>
<button id="btnRest">Finger to rest</button>
<button id="btnStart">2. Start reading bot</button>

<h3>Reading timer</h3>
<div class="grid">
  <div><label>Hours</label><input id="hours" type="number" min="0" step="1" value="0"></div>
  <div><label>Minutes</label><input id="minutes" type="number" min="0" step="1" value="0"></div>
</div>
<div style="font-size: 12px; color: #aaa; margin: 4px 0;">The bot stops by itself when this time is up. Leave both at 0 for no limit.</div>

<h3>Settings</h3>
<div class="grid">
  <div><label>Words on a sparse page</label><input id="minW" type="number" value="20"></div>
  <div><label>Words on a full page</label><input id="maxW" type="number" value="300"></div>
  <div><label>Shortest wait (s)</label><input id="minT" type="number" value="10"></div>
  <div><label>Longest wait (s)</label><input id="maxT" type="number" value="45"></div>
  <div><label>Wait after tap (s)</label><input id="settle" type="number" value="2"></div>
</div>
<pre id="log"></pre>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = m => { $('log').textContent = m + '\n' + $('log').textContent.slice(0, 1500); };

let device = null, chr = null, worker = null, running = false;

if (!navigator.bluetooth) {
  log('This browser has no Web Bluetooth. Use Chrome on Android (or Bluefy on iPhone).');
}

// ---------- Bluetooth (HM-10: service FFE0, characteristic FFE1) ----------
async function openGatt() {
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(0xFFE0);
  chr = await svc.getCharacteristic(0xFFE1);
  try {                                        // show the Arduino's replies in the log
    await chr.startNotifications();
    chr.addEventListener('characteristicvaluechanged', e =>
      log('Arduino: ' + new TextDecoder().decode(e.target.value).trim()));
  } catch (e) { /* replies are optional */ }
}
async function onDisconnected() {
  chr = null;
  log('Bluetooth lost, reconnecting...');
  for (let i = 0; i < 5; i++) {
    try { await openGatt(); log('Reconnected'); return; } catch (e) { await sleep(2000); }
  }
  log('Could not reconnect. Tap Connect Arduino again.');
}
async function connectBle() {
  try {
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true, optionalServices: [0xFFE0]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    await openGatt();
    log('Arduino connected: ' + (device.name || 'unnamed'));
    $('status').textContent = 'Arduino connected';
  } catch (e) { log('Bluetooth: ' + e.message); }
}
async function sendChar(ch) {
  if (!chr) throw new Error('Arduino not connected');
  const data = new TextEncoder().encode(ch);
  if (chr.writeValueWithoutResponse) await chr.writeValueWithoutResponse(data);
  else await chr.writeValue(data);
}
const sendFlip = () => sendChar('F');          // F = tap the key

// ---------- Camera ----------
let track = null, previewTimer = null;

async function startCam() {
  if ($('cam').srcObject) return;                  // already running
  const base = { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } };
  let stream;
  try {                                            // ask for camera zoom control too
    stream = await navigator.mediaDevices.getUserMedia({ video: { ...base, zoom: true }, audio: false });
  } catch (e) {
    stream = await navigator.mediaDevices.getUserMedia({ video: base, audio: false });
  }
  $('cam').srcObject = stream;
  await $('cam').play();
  setupHwZoom(stream.getVideoTracks()[0]);
  if (!previewTimer) previewTimer = setInterval(drawPreview, 100);
}

function setupHwZoom(t) {                          // the phone camera's own zoom, if it has one
  track = t;
  let caps = {};
  try { caps = t.getCapabilities ? t.getCapabilities() : {}; } catch (e) {}
  if (!caps.zoom) { log('This phone does not offer camera zoom to the browser. Use crop zoom, or move the phone closer.'); return; }
  const z = $('hwZoom');
  z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
  let cur = caps.zoom.min;
  try { cur = t.getSettings().zoom || cur; } catch (e) {}
  z.value = cur;
  $('hwZoomVal').textContent = (+z.value).toFixed(1) + 'x';
  $('hwZoomBox').style.display = 'block';
  z.oninput = async () => {
    $('hwZoomVal').textContent = (+z.value).toFixed(1) + 'x';
    try { await track.applyConstraints({ advanced: [{ zoom: +z.value }] }); }
    catch (e) { log('Zoom: ' + e.message); }
  };
}

function cropRect() {                              // the part of the camera picture that is read
  const v = $('cam'), vw = v.videoWidth, vh = v.videoHeight;
  const z = +$('dz').value;
  const w = vw / z, h = vh / z;
  const mx = (vw - w) / 2, my = (vh - h) / 2;
  return { x: mx + (+$('panX').value / 100) * mx,
           y: my + (+$('panY').value / 100) * my, w: w, h: h };
}
function drawPreview() {
  const v = $('cam'), p = $('preview');
  if (!v.videoWidth) return;
  const r = cropRect();
  const w = 640, h = Math.round(640 * r.h / r.w);
  if (p.width !== w || p.height !== h) { p.width = w; p.height = h; }
  p.getContext('2d').drawImage(v, r.x, r.y, r.w, r.h, 0, 0, w, h);
}
function grab() {
  const v = $('cam'), r = cropRect();
  const scale = Math.max(1, Math.min(2, 1400 / r.w));   // enlarge small crops a little for OCR
  const c = document.createElement('canvas');
  c.width = Math.round(r.w * scale); c.height = Math.round(r.h * scale);
  c.getContext('2d').drawImage(v, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
  return c;
}

// ---------- Measuring the page ----------
async function countWords(canvas) {
  const { data } = await worker.recognize(canvas);
  const words = data.text.split(/\s+/).filter(t => (t.match(/[\p{L}\p{N}]/gu) || []).length >= 2);
  return { n: words.length, preview: data.text.slice(0, 120).replace(/\s+/g, ' ') };
}
function inkPercent(canvas) {          // fallback for picture / blank pages
  const w = 400, h = Math.round(canvas.height * w / canvas.width);
  const s = document.createElement('canvas'); s.width = w; s.height = h;
  const ctx = s.getContext('2d'); ctx.drawImage(canvas, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const g = new Uint8Array(w * h), hist = new Array(256).fill(0);
  for (let i = 0; i < w * h; i++) {
    const v = (d[4*i] * 0.299 + d[4*i+1] * 0.587 + d[4*i+2] * 0.114) | 0;
    g[i] = v; hist[v]++;
  }
  let acc = 0, paper = 255;            // paper brightness = 90th percentile
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= 0.9 * w * h) { paper = v; break; } }
  let dark = 0;
  for (let i = 0; i < w * h; i++) if (g[i] < paper * 0.6) dark++;
  return 100 * dark / (w * h);
}
function waitSeconds(words, ink) {
  const minW = +$('minW').value, maxW = +$('maxW').value;
  const minT = +$('minT').value, maxT = +$('maxT').value;
  let r = words >= 15 ? (words - minW) / (maxW - minW) : (ink - 2) / (12 - 2);
  r = Math.max(0, Math.min(1, r));
  return minT + r * (maxT - minT);
}

// ---------- Reading timer ----------
let sessionEnd = null, timeUp = false;
function sessionMs() {
  const h = Math.max(0, parseInt($('hours').value, 10) || 0);
  const m = Math.max(0, parseInt($('minutes').value, 10) || 0);
  return (h * 60 + m) * 60000;
}
function fmt(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
}
function finishSession() {
  timeUp = true; running = false; sessionEnd = null;
  $('btnStart').textContent = '2. Start reading bot';
  $('timer').textContent = 'Reading time finished';
  log('Reading time finished, the bot has stopped.');
  try { if (navigator.vibrate) navigator.vibrate([300, 100, 300]); } catch (e) {}
}
function tickTimer() {
  if (running && sessionEnd) {
    const left = sessionEnd - Date.now();
    if (left <= 0) { finishSession(); return; }
    $('timer').textContent = 'Reading time left: ' + fmt(left);
  } else if (running) {
    $('timer').textContent = 'Reading timer: no limit';
  } else if (!timeUp) {
    $('timer').textContent = 'Reading timer: not running';
  }
}
setInterval(tickTimer, 1000);

// ---------- Main loop ----------
async function loop() {
  while (running) {
    const t0 = Date.now();
    $('status').textContent = 'Reading the page...';
    const frame = grab();
    const ink = inkPercent(frame);
    let words = 0, preview = '';
    try { const r = await countWords(frame); words = r.n; preview = r.preview; }
    catch (e) { log('OCR error: ' + e.message); }
    const target = waitSeconds(words, ink);
    log('words=' + words + ' ink=' + ink.toFixed(1) + '% -> wait ' + target.toFixed(0) + 's | ' + preview);

    const end = t0 + target * 1000;     // OCR time counts toward the wait
    while (running && Date.now() < end) {
      $('status').textContent = 'Next page in ' + Math.ceil((end - Date.now()) / 1000) + ' s';
      await sleep(250);
    }
    if (!running) break;
    try { await sendFlip(); log('Tap sent'); } catch (e) { log('Tap failed: ' + e.message); }
    $('status').textContent = 'Tapping...';
    await sleep((+$('settle').value) * 1000);
  }
  $('status').textContent = timeUp ? 'Reading time finished' : 'Stopped';
}

// ---------- Buttons ----------
$('btnBle').onclick = connectBle;
$('btnCam').onclick = async () => {
  try { await startCam(); $('status').textContent = 'Camera on'; }
  catch (e) { log('Camera: ' + e.message); }
};
document.querySelectorAll('[data-dz]').forEach(b => b.onclick = () => {
  $('dz').value = b.dataset.dz; $('dz').dispatchEvent(new Event('input'));
});
$('btnZoomReset').onclick = () => {
  $('dz').value = 1; $('panX').value = 0; $('panY').value = 0;
  $('dz').dispatchEvent(new Event('input'));
  const z = $('hwZoom');
  if ($('hwZoomBox').style.display !== 'none') { z.value = z.min; z.oninput(); }
};

// remember zoom and settings on this phone
const SAVED = ['minW', 'maxW', 'minT', 'maxT', 'settle', 'hours', 'minutes', 'dz', 'panX', 'panY'];
function updateZoomLabels() { $('dzVal').textContent = (+$('dz').value).toFixed(1) + 'x'; }
function saveSettings() {
  try {
    const d = {}; SAVED.forEach(id => d[id] = $(id).value);
    localStorage.setItem('readingBotSettings', JSON.stringify(d));
  } catch (e) {}
}
try {
  const d = JSON.parse(localStorage.getItem('readingBotSettings') || '{}');
  SAVED.forEach(id => { if (d[id] !== undefined) $(id).value = d[id]; });
} catch (e) {}
updateZoomLabels();
SAVED.forEach(id => $(id).addEventListener('input', () => { updateZoomLabels(); saveSettings(); }));
$('btnMinus').onclick = () => sendChar('-').catch(e => log(e.message));
$('btnPlus').onclick = () => sendChar('+').catch(e => log(e.message));
$('btnRest').onclick = () => sendChar('r').catch(e => log(e.message));
$('btnTest').onclick = async () => {
  try { await sendFlip(); log('Test tap sent'); } catch (e) { log(e.message); }
};
$('btnStart').onclick = async () => {
  if (running) { running = false; sessionEnd = null; $('btnStart').textContent = '2. Start reading bot'; return; }
  try {
    $('status').textContent = 'Starting camera...';
    await startCam();
    if (!worker) {
      $('status').textContent = 'Loading OCR (needs internet)...';
      worker = await Tesseract.createWorker('eng');   // change 'eng' for other languages
    }
    try { await navigator.wakeLock.request('screen'); } catch (e) {}
    const ms = sessionMs();
    timeUp = false;
    sessionEnd = ms > 0 ? Date.now() + ms : null;    // 0 hours and 0 minutes = no limit
    running = true;
    $('btnStart').textContent = 'Stop';
    tickTimer();
    loop();
  } catch (e) { log('Start failed: ' + e.message); $('status').textContent = 'Error'; }
};
</script>
</body>
</html>
